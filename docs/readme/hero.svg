<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">Absolute Download Manager</title>
<desc id="d">One file split into eight parallel segments that fill at their own speed, then complete with a check mark.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#3FD8F2"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E4E0FF"/><stop offset="1" stop-color="#9FEFFF"/></linearGradient>
  <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="vignette" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="frame"><rect width="1200" height="440" rx="28"/></clipPath>
  <clipPath id="titleClip"><text x="86" y="206" font-size="58" font-weight="700" letter-spacing="-1.6">Absolute</text><text x="86" y="268" font-size="58" font-weight="700" letter-spacing="-1.6">Download Manager</text></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<style>
  text{font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,sans-serif}
  .seg,.sweep,.check,.ring{transform-box:fill-box}
  .seg{transform-origin:left center}
  @keyframes fill0{0%,10.0%{transform:scaleX(0)}46.0%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.f0{animation:fill0 8.0s cubic-bezier(.22,.8,.2,1) infinite}@keyframes fill1{0%,10.0%{transform:scaleX(0)}38.0%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.f1{animation:fill1 8.0s cubic-bezier(.22,.8,.2,1) infinite}@keyframes fill2{0%,10.0%{transform:scaleX(0)}55.0%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.f2{animation:fill2 8.0s cubic-bezier(.22,.8,.2,1) infinite}@keyframes fill3{0%,10.0%{transform:scaleX(0)}42.0%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.f3{animation:fill3 8.0s cubic-bezier(.22,.8,.2,1) infinite}@keyframes fill4{0%,10.0%{transform:scaleX(0)}60.0%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.f4{animation:fill4 8.0s cubic-bezier(.22,.8,.2,1) infinite}@keyframes fill5{0%,10.0%{transform:scaleX(0)}50.0%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.f5{animation:fill5 8.0s cubic-bezier(.22,.8,.2,1) infinite}@keyframes fill6{0%,10.0%{transform:scaleX(0)}66.0%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.f6{animation:fill6 8.0s cubic-bezier(.22,.8,.2,1) infinite}@keyframes fill7{0%,10.0%{transform:scaleX(0)}58.0%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.f7{animation:fill7 8.0s cubic-bezier(.22,.8,.2,1) infinite}
  @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,40px)}}
  @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-110px,-30px)}}
  .auroraA{animation:driftA 14s ease-in-out infinite}
  .auroraB{animation:driftB 17s ease-in-out infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
  .r1{animation:rise 1.1s cubic-bezier(.05,.7,.1,1) .1s both}
  .r2{animation:rise 1.1s cubic-bezier(.05,.7,.1,1) .35s both}
  .r3{animation:rise 1.1s cubic-bezier(.05,.7,.1,1) .6s both}
  .r4{animation:rise 1.1s cubic-bezier(.05,.7,.1,1) .85s both}
  @keyframes sweep{0%,55%{transform:translateX(-260px)}85%,100%{transform:translateX(860px)}}
  .sweep{animation:sweep 6s cubic-bezier(.45,0,.2,1) 1.2s infinite}
  @keyframes glowPulse{0%,10%{opacity:0}30%,66%{opacity:.45}72%,90%{opacity:.95}97%,100%{opacity:0}}
  .barGlow{animation:glowPulse 8.0s ease-in-out infinite}
  @keyframes land{0%,68%{opacity:0;transform:scale(.3)}74%{opacity:1;transform:scale(1.12)}78%,90%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
  .check{transform-origin:center;animation:land 8.0s cubic-bezier(.2,.9,.3,1.2) infinite}
  @keyframes ring{0%,68%{opacity:0;transform:scale(.6)}72%{opacity:.8}86%,100%{opacity:0;transform:scale(2.1)}}
  .ring{transform-origin:center;animation:ring 8.0s cubic-bezier(.1,.6,.2,1) infinite}
  @keyframes status{0%,68%{opacity:1}72%,95%{opacity:0}100%{opacity:1}}
  @keyframes statusDone{0%,70%{opacity:0}75%,92%{opacity:1}97%,100%{opacity:0}}
  .busy{animation:status 8.0s linear infinite}
  .done{animation:statusDone 8.0s linear infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  .live{animation:blink 1.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.seg{transform:none}.check{opacity:1}.busy{opacity:0}.done{opacity:1}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="440" fill="#08080F"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <ellipse class="auroraA" cx="300" cy="80" rx="360" ry="190" fill="#6E5BFF" opacity=".42" filter="url(#blur)"/>
  <ellipse class="auroraB" cx="980" cy="400" rx="380" ry="170" fill="#22D3EE" opacity=".26" filter="url(#blur)"/>
  <rect width="1200" height="440" fill="url(#vignette)"/>

  <g class="r1">
    <rect x="88" y="72" width="60" height="60" rx="17" fill="url(#brand)" opacity=".55" filter="url(#soft)"/>
    <rect x="88" y="72" width="60" height="60" rx="17" fill="url(#brand)"/>
    <path d="M118 87v24m-10-10 10 10 10-10M107 119h22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="r2">
    <text x="86" y="206" font-size="58" font-weight="700" letter-spacing="-1.6" fill="url(#title)">Absolute</text>
    <text x="86" y="268" font-size="58" font-weight="700" letter-spacing="-1.6" fill="url(#title)">Download Manager</text>
    <g clip-path="url(#titleClip)"><rect class="sweep" x="0" y="150" width="180" height="140" fill="url(#glint)" opacity=".55" transform="skewX(-18)"/></g>
  </g>
  <text class="r3" x="89" y="310" font-size="19" fill="#B9B5D6">Segmented. Resumable. Every connection you have, at once.</text>
  <g class="r4" font-size="15" font-weight="600" fill="#E9E7FF">
    <rect x="88" y="336" width="132" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text x="154" y="358" text-anchor="middle">Parallel parts</text>
    <rect x="230" y="336" width="132" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text x="296" y="358" text-anchor="middle">Multi-network</text>
    <rect x="372" y="336" width="148" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/><text x="446" y="358" text-anchor="middle">Browser capture</text>
  </g>

  <g class="r3">
    <rect x="640" y="132" width="520" height="196" rx="22" fill="#11111C" fill-opacity=".72" stroke="#fff" stroke-opacity=".10"/>
    <rect x="668" y="160" width="40" height="40" rx="11" fill="url(#brand)" opacity=".9"/>
    <path d="M681 172h11l6 6v12h-17z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="724" y="177" font-size="17" font-weight="600" fill="#F3F2FF">ubuntu-24.04-desktop.iso</text>
    <text class="busy" x="724" y="198" font-size="14" fill="#9C98BC"><tspan class="live" fill="#3FD8F2">&#9679;</tspan> 8 connections over Wi-Fi + Ethernet</text>
    <text class="done" x="724" y="198" font-size="14" fill="#7DF0C4">Complete, checked and ready</text>
    <rect class="barGlow" x="668" y="250" width="468" height="18" rx="9" fill="url(#bar)" filter="url(#glow)"/>
    <rect x="668.0" y="252" width="53.2" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect class="seg f0" x="668.0" y="252" width="53.2" height="14" rx="7" fill="url(#bar)"/><rect x="727.2" y="252" width="53.2" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect class="seg f1" x="727.2" y="252" width="53.2" height="14" rx="7" fill="url(#bar)"/><rect x="786.5" y="252" width="53.2" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect class="seg f2" x="786.5" y="252" width="53.2" height="14" rx="7" fill="url(#bar)"/><rect x="845.8" y="252" width="53.2" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect class="seg f3" x="845.8" y="252" width="53.2" height="14" rx="7" fill="url(#bar)"/><rect x="905.0" y="252" width="53.2" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect class="seg f4" x="905.0" y="252" width="53.2" height="14" rx="7" fill="url(#bar)"/><rect x="964.2" y="252" width="53.2" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect class="seg f5" x="964.2" y="252" width="53.2" height="14" rx="7" fill="url(#bar)"/><rect x="1023.5" y="252" width="53.2" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect class="seg f6" x="1023.5" y="252" width="53.2" height="14" rx="7" fill="url(#bar)"/><rect x="1082.8" y="252" width="53.2" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect class="seg f7" x="1082.8" y="252" width="53.2" height="14" rx="7" fill="url(#bar)"/>
    <text x="668" y="296" font-size="13" fill="#7F7AA3">5.7 GB</text>
    <text x="1136" y="296" font-size="13" fill="#7F7AA3" text-anchor="end">fast parts take over from slow ones</text>
    <circle class="ring" cx="1116" cy="180" r="18" fill="none" stroke="#7DF0C4" stroke-width="2"/>
    <g class="check"><circle cx="1116" cy="180" r="18" fill="#1E3B33"/><path d="M1107 180.5l6 6 12-13" fill="none" stroke="#7DF0C4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <rect width="1200" height="440" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
</g>
</svg>
