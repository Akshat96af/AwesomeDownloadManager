<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Features: Parallel segments, Adaptive connections, Every network at once, Resume anywhere, YouTube, every quality, Cinematic, but light">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="accentLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#8B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151524"/><stop offset="1" stop-color="#0D0D17"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B7BFF" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".45"/></linearGradient>
</defs>
<style>
  text{font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,sans-serif}
  .grow,.eq,.pulse,.spin,.sheen{transform-box:fill-box}
  .tile{animation:rise 1s cubic-bezier(.05,.7,.1,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .grow{transform-origin:left center;animation:fill 4.2s cubic-bezier(.22,.8,.2,1) infinite}
  .g0{animation-duration:3.4s}.g1{animation-duration:4.6s}.g2{animation-duration:3.9s}.g3{animation-duration:5.1s}
  @keyframes fill{0%{transform:scaleX(0)}70%,88%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
  .eq{transform-origin:center bottom;animation:eq 2.6s ease-in-out infinite}
  .e1{animation-delay:.25s}.e2{animation-delay:.5s}.e3{animation-delay:.75s}
  @keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
  .flow{animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}
  .pulse{transform-origin:center;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.15)}}
  .spin{transform-origin:center;animation:spin 3.2s cubic-bezier(.6,0,.3,1) infinite}@keyframes spin{0%,20%{transform:rotate(0)}80%,100%{transform:rotate(360deg)}}
  .sheen{animation:sheen 3s cubic-bezier(.4,0,.2,1) infinite}@keyframes sheen{0%,40%{transform:translateX(0)}100%{transform:translateX(80px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="tile" style="animation-delay:0.00s"><rect x="0.5" y="0.5" width="379" height="209" rx="22" fill="url(#card)" stroke="url(#edge)"/><rect x="28" y="28" width="64" height="64" rx="18" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><rect x="36" y="40" width="48" height="7" rx="3.5" fill="#fff" fill-opacity=".08"/><rect class="grow g0" x="36" y="40" width="48" height="7" rx="3.5" fill="url(#accent)"/><rect x="36" y="52" width="48" height="7" rx="3.5" fill="#fff" fill-opacity=".08"/><rect class="grow g1" x="36" y="52" width="48" height="7" rx="3.5" fill="url(#accent)"/><rect x="36" y="64" width="48" height="7" rx="3.5" fill="#fff" fill-opacity=".08"/><rect class="grow g2" x="36" y="64" width="48" height="7" rx="3.5" fill="url(#accent)"/><rect x="36" y="76" width="48" height="7" rx="3.5" fill="#fff" fill-opacity=".08"/><rect class="grow g3" x="36" y="76" width="48" height="7" rx="3.5" fill="url(#accent)"/><text x="28" y="132" font-size="21" font-weight="700" fill="#F4F2FF">Parallel segments</text><text x="28" y="162" font-size="15" fill="#A9A5C8">One file, up to 16 connections.</text><text x="28" y="184" font-size="15" fill="#A9A5C8">Fast parts take over slow ones.</text></g><g class="tile" style="animation-delay:0.12s"><rect x="410.5" y="0.5" width="379" height="209" rx="22" fill="url(#card)" stroke="url(#edge)"/><rect x="438" y="28" width="64" height="64" rx="18" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><rect class="eq e0" x="448" y="66" width="8" height="14" rx="3" fill="url(#accent)"/><rect class="eq e1" x="460" y="58" width="8" height="22" rx="3" fill="url(#accent)"/><rect class="eq e2" x="472" y="50" width="8" height="30" rx="3" fill="url(#accent)"/><rect class="eq e3" x="484" y="40" width="8" height="40" rx="3" fill="url(#accent)"/><text x="438" y="132" font-size="21" font-weight="700" fill="#F4F2FF">Adaptive connections</text><text x="438" y="162" font-size="15" fill="#A9A5C8">Grows while every link delivers,</text><text x="438" y="184" font-size="15" fill="#A9A5C8">backs off when a server pushes back.</text></g><g class="tile" style="animation-delay:0.24s"><rect x="820.5" y="0.5" width="379" height="209" rx="22" fill="url(#card)" stroke="url(#edge)"/><rect x="848" y="28" width="64" height="64" rx="18" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><line class="flow" x1="880" y1="62" x2="860" y2="46" stroke="url(#accentLine)" stroke-width="2.5" stroke-dasharray="4 6"/><line class="flow" x1="880" y1="62" x2="900" y2="46" stroke="url(#accentLine)" stroke-width="2.5" stroke-dasharray="4 6"/><line class="flow" x1="880" y1="62" x2="880" y2="80" stroke="url(#accentLine)" stroke-width="2.5" stroke-dasharray="4 6"/><circle cx="860" cy="46" r="6" fill="#141424" stroke="#7DE7F7" stroke-width="2.5"/><circle cx="900" cy="46" r="6" fill="#141424" stroke="#7DE7F7" stroke-width="2.5"/><circle cx="880" cy="80" r="6" fill="#141424" stroke="#7DE7F7" stroke-width="2.5"/><circle class="pulse" cx="880" cy="62" r="8" fill="url(#accent)"/><text x="848" y="132" font-size="21" font-weight="700" fill="#F4F2FF">Every network at once</text><text x="848" y="162" font-size="15" fill="#A9A5C8">Wi-Fi, Ethernet and a tethered</text><text x="848" y="184" font-size="15" fill="#A9A5C8">phone, speeds added together.</text></g><g class="tile" style="animation-delay:0.36s"><rect x="0.5" y="240.5" width="379" height="209" rx="22" fill="url(#card)" stroke="url(#edge)"/><rect x="28" y="268" width="64" height="64" rx="18" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><g class="spin"><path d="M60 280a20 20 0 1 1-17.3 10" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/><path d="M37 282l6 9 9-5" fill="none" stroke="#7DE7F7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M56 292v16l13-8z" fill="#fff" fill-opacity=".92"/><text x="28" y="372" font-size="21" font-weight="700" fill="#F4F2FF">Resume anywhere</text><text x="28" y="402" font-size="15" fill="#A9A5C8">Pauses, crashes and dropped links</text><text x="28" y="424" font-size="15" fill="#A9A5C8">pick up where they stopped.</text></g><g class="tile" style="animation-delay:0.48s"><rect x="410.5" y="240.5" width="379" height="209" rx="22" fill="url(#card)" stroke="url(#edge)"/><rect x="438" y="268" width="64" height="64" rx="18" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><clipPath id="yt"><rect x="444" y="282" width="52" height="36" rx="11"/></clipPath><rect x="444" y="282" width="52" height="36" rx="11" fill="url(#accent)"/><g clip-path="url(#yt)"><rect class="sheen" x="428" y="278" width="12" height="44" fill="#fff" fill-opacity=".35" transform="skewX(-18)"/></g><path d="M465 291v18l15-9z" fill="#fff"/><text x="438" y="372" font-size="21" font-weight="700" fill="#F4F2FF">YouTube, every quality</text><text x="438" y="402" font-size="15" fill="#A9A5C8">IDM-style quality menu, merged</text><text x="438" y="424" font-size="15" fill="#A9A5C8">into one file with ffmpeg.</text></g><g class="tile" style="animation-delay:0.60s"><rect x="820.5" y="240.5" width="379" height="209" rx="22" fill="url(#card)" stroke="url(#edge)"/><rect x="848" y="268" width="64" height="64" rx="18" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><path d="M854 318C874 318 878 282 906 282" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="3"/><circle r="7" fill="url(#accent)"><animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="spline" keySplines=".65 0 .35 1;.65 0 .35 1" path="M854 318C874 318 878 282 906 282"/></circle><text x="848" y="372" font-size="21" font-weight="700" fill="#F4F2FF">Cinematic, but light</text><text x="848" y="402" font-size="15" fill="#A9A5C8">Spring-driven motion everywhere,</text><text x="848" y="424" font-size="15" fill="#A9A5C8">about 30 MB idle in the tray.</text></g>
</svg>
